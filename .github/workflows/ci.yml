name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.8'  # nimble 0.20.1; newer nimble (0.22.x) breaks `nimble setup`
      - run: sudo apt-get update && sudo apt-get install -y libsecp256k1-dev librocksdb-dev libsnappy-dev liblz4-dev libsqlite3-dev zlib1g-dev
      - run: nimble setup -y
      - run: nimble build -d:release -y

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.8'  # nimble 0.20.1; newer nimble (0.22.x) breaks `nimble setup`
      - run: sudo apt-get update && sudo apt-get install -y libsecp256k1-dev librocksdb-dev libsnappy-dev liblz4-dev libsqlite3-dev zlib1g-dev
      - run: nimble setup -y
      - run: nimble test -y

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: nimrod:${{ github.sha }}
